---
- name: Deploy SuperFastPDFComposer to IONOS (Co-existence Mode)
  hosts: webserver
  vars:
    app_dir: "/var/www/superfastpdfcomposer"
    node_version: "20.x"
    app_port: 3005

  tasks:
    - name: Update apt cache
      become: yes
      apt: update_cache=yes

    - name: Install Node.js and PM2
      become: yes
      shell: |
        curl -fsSL https://deb.nodesource.com/setup_{{ node_version }} | bash -
        apt-get install -y nodejs rsync
        npm install -y pm2 -g

    - name: Create dedicated app directory
      become: yes
      file: path={{ app_dir }} state=directory owner=root group=root mode='0755'

    # TASK REMOVED: "Copy project files" was deleted because it had illegal parameters
    # and was redundant with the synchronize task below.

    - name: Sync project files
      synchronize:
        src: ./
        dest: "{{ app_dir }}/"
        recursive: yes
        delete: yes
        rsync_opts:
          - "--exclude=.next"
          - "--exclude=node_modules"
          - "--exclude=ansible"
          - "--exclude=.git"
      delegate_to: localhost
      become: no

    - name: Build Application
      become: yes
      shell: |
        npm install
        npm run build
      args:
        chdir: "{{ app_dir }}"

    - name: Start App on Port 3005 via PM2
      become: yes
      shell: |
        pm2 delete superfastpdfcomposer || true
        PORT={{ app_port }} pm2 start npm --name "superfastpdfcomposer" -- start
      args:
        chdir: "{{ app_dir }}"

    - name: Create Unique Nginx Config
      become: yes
      copy:
        dest: /etc/nginx/sites-available/superfastpdfcomposer
        content: |
          server {
              listen 3005; 
              server_name 212.227.39.191;
              location / {
                  proxy_pass http://localhost:{{ app_port }};
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection 'upgrade';
                  proxy_set_header Host $host;
              }
          }

    - name: Enable Site and Restart Nginx
      become: yes
      file:
        src: /etc/nginx/sites-available/superfastpdfcomposer
        dest: /etc/nginx/sites-enabled/superfastpdfcomposer
        state: link
      notify: Restart Nginx

  handlers:
    - name: Restart Nginx
      become: yes
      service: name=nginx state=restarted